name: Deploy Frontend

on:
  push:
    branches: [ "master" ]


jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
#    - name: Login to docker
#      run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
    - name: Build the Docker image
      run: docker build -t dsaraiya73/docker-react -f Dockerfile.dev .
    - name: run test
      run: docker run -e CI=true dsaraiya73/docker-react npm run test
